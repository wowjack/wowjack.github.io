<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jack Kingham</title>
    <link rel="stylesheet" href="/includes/style.css" />
</head>

<body class="dark">
    <nav>
    <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/bio">Bio</a></li>
        <li><a href="/showcase">Showcase</a></li>
        <li><a href="/notes">Notes</a></li>
    </ul>
    <div class="theme-toggle">
    <label for="theme-select">Theme:</label>
    <select id="theme-select">
        <option value="dark">Dark</option>
        <option value="light">Light</option>
        <!-- <option value="solarized">Solarized</option> -->
        <!-- <option value="high-contrast">High Contrast</option> -->
    </select>
    <script>
        const theme_select = document.getElementById('theme-select');
        const body = document.body;
        let theme = localStorage.getItem("theme") || "dark";
        theme_select.value = theme;
        const theme_list = ["dark", "light"];
        
        for(let t of theme_list) {
            body.classList.remove(t);
        }
        body.classList.add(theme);

        theme_select.addEventListener('change', () => {
            theme = theme_select.value;
            for(let t of theme_list) {
                body.classList.remove(t);
            }
            body.classList.add(theme);
            localStorage.setItem("theme", theme);
        });
    </script>
</div>
</nav>
    <div id="page-content">
        <h1>
    This is the bio page
</h1>

<p>
    Some stuff about me, headshot, interests, likes, etc
</p>
    </div>
</body>

<script>
    if (localStorage.getItem("light-theme") === "true") {
        document.querySelector("body.dark").setAttribute("class", "light");
    }
</script>

</html>
