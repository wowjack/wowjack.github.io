<div class="theme-toggle">
    <label for="theme-select">Theme:</label>
    <select id="theme-select">
        <option value="dark">Dark</option>
        <option value="light">Light</option>
        <!-- <option value="solarized">Solarized</option> -->
        <!-- <option value="high-contrast">High Contrast</option> -->
    </select>
    <script>
        const theme_select = document.getElementById('theme-select');
        const body = document.body;
        let theme = localStorage.getItem("theme") || "dark";
        theme_select.value = theme;
        const theme_list = ["dark", "light"];
        
        // Change body class to theme
        for(let t of theme_list) {
            body.classList.remove(t);
        }
        body.classList.add(theme);

        // Enable or disable relevant prism css file
        let prism_dark = document.getElementById("prism-dark-css");
        let prism_light = document.getElementById("prism-light-css");
        prism_dark.disabled = (theme !== "dark")
        prism_light.disabled = (theme !== "light")

        theme_select.addEventListener('change', () => {
            theme = theme_select.value;
            for(let t of theme_list) {
                body.classList.remove(t);
            }
            body.classList.add(theme);

            prism_dark.disabled = (theme !== "dark")
            prism_light.disabled = (theme !== "light")

            localStorage.setItem("theme", theme);
        });
    </script>
</div>
